# SonarCloud Configuration for RathonWare
sonar.organization=ismaeluml
sonar.projectKey=ismaelUML_RathonWare
sonar.projectName=RathonWare
sonar.projectVersion=1.0.0

# Source and Test directories
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# C++ standards and file suffixes
sonar.cxx.standards=c++20
sonar.cxx.file.suffixes=.cpp,.h,.hpp,.cxx,.hxx

# Exclusions
sonar.exclusions=build/**,dist/**,assets/**
