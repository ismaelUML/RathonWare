name: CI Quality Gate & SonarCloud

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test-and-sonar:
    name: Build, Unit Tests & Quality Gate
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0 # Shallow clones disabled for accurate SonarCloud analysis

    - name: Set up Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: '3.11'

    - name: Install Qt 6 (MinGW 64-bit)
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
      with:
        version: '6.6.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        tools: 'tools_mingw1310'
        cache: true

    - name: Sanitize Runner PATH (Remove Strawberry Perl)
      run: |
        # Strip Strawberry Perl from PATH to eliminate ABI collision between Strawberry's GCC and Qt's MinGW
        $cleanPath = ($env:PATH -split ';' | Where-Object { $_ -notlike '*Strawberry*' }) -join ';'
        "PATH=$cleanPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      shell: powershell

    - name: Configure CMake
      run: |
        if (Get-Command gcc -ErrorAction SilentlyContinue) {
            $gccBin = Split-Path (Get-Command gcc).Source
            $env:PATH = "$gccBin;$env:PATH"
        }
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"
      shell: powershell

    - name: Compile Application & Unit Test Suite
      run: |
        if (Get-Command gcc -ErrorAction SilentlyContinue) {
            $gccBin = Split-Path (Get-Command gcc).Source
            $env:PATH = "$gccBin;$env:PATH"
        }
        cmake --build build --config Release
      shell: powershell

    - name: Run Automated Unit Tests (CTest)
      run: |
        if (Get-Command gcc -ErrorAction SilentlyContinue) {
            $gccBin = Split-Path (Get-Command gcc).Source
            $env:PATH = "$gccBin;$env:PATH"
        }
        if (Test-Path "$env:Qt6_DIR\bin") {
            $env:PATH = "$env:Qt6_DIR\bin;$env:PATH"
        }
        ctest --test-dir build --output-on-failure --verbose
      shell: powershell

    - name: Cyclomatic Complexity Audit
      run: |
        python -m pip install --upgrade pip lizard
        lizard src/ -C 5 -W src/common/ src/domain/ src/ports/ src/usecases/
      shell: powershell
      continue-on-error: true

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3.1.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true # Allows CI green check even if user hasn't bound SonarCloud secret token yet
